# Dual-run overlay: native Go MDT sidecar on host :57502 while Telegraf keeps :57500.
#
#   docker compose -f docker-compose.yml -f docker-compose.build-local.yml -f docker-compose.mdt-go.yml up -d netspec-mdt
#
# Point a lab switch at <host>:57502 protocol grpc-tcp. Production Telegraf on :57500 is unchanged.

services:
  netspec-mdt:
    image: netspec-mdt:local
    build:
      context: .
      dockerfile: Dockerfile
      target: netspec-mdt
      args:
        VERSION: ${NETSPEC_LOCAL_VERSION:-dev}
        COMMIT: ${NETSPEC_LOCAL_COMMIT:-unknown}
        BUILD_DATE: ${NETSPEC_LOCAL_BUILD_DATE:-unknown}
    container_name: netspec-mdt
    restart: unless-stopped
    networks:
      - netspec
    ports:
      - "57502:57500"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NETSPEC_INGEST_HOST=${NETSPEC_INGEST_HOST:-netspec-netspec}
      - NETSPEC_INGEST_PORT=${NETSPEC_INGEST_PORT:-57500}
      - NETSPEC_INGEST_TARGETS=${NETSPEC_INGEST_TARGETS:-}
      - MDT_ALLOWED_DEVICES=${MDT_ALLOWED_DEVICES:-}
      - MDT_RESEND_INTERVAL=${MDT_RESEND_INTERVAL:-60s}
    depends_on:
      - netspec-netspec
    logging:
      driver: json-file
      options:
        max-size: ${TRANSLATOR_LOG_MAX_SIZE:-10m}
        max-file: "${TRANSLATOR_LOG_MAX_FILE:-5}"
    mem_limit: ${TRANSLATOR_MEM_LIMIT:-512m}
    cpus: "${TRANSLATOR_CPU_LIMIT:-1.0}"
    pids_limit: ${TRANSLATOR_PIDS_LIMIT:-256}
