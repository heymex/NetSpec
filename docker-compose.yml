# NetSpec + Apprise-API + Go MDT sidecar.
#
# NetSpec's job is to detect drift from desired state and surface it (including via alerts).
# Apprise-API receives NetSpec POST /notify traffic and fans out to Slack, email, Teams, etc.
# netspec-mdt accepts IOS-XE grpc-tcp dial-out on host :57500 and forwards NDJSON to
# netspec-netspec:57500. Metrics are on host :8089 (/health /stats /metrics).
# Service names use a netspec- prefix so the project groups cleanly in tooling and avoids
# clashing with other stacks on the same host (unique container names).
# For local builds from source, merge docker-compose.build-local.yml.
# Telegraf + Python translator: docker-compose.legacy-mdt.yml (do not bind :57500 twice).

services:
  netspec-netspec:
    image: ghcr.io/heymex/netspec:${NETSPEC_IMAGE_TAG:-latest}
    container_name: netspec-netspec
    restart: unless-stopped
    networks:
      - netspec
    ports:
      - "${API_PORT:-8088}:${API_PORT:-8088}"
    volumes:
      # Read-write so dashboard/API can persist split devices and desired-state edits under /config.
      # (Mounting :ro breaks deletes and patches to config/devices/*.yaml with "read-only file system".)
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/config:/config
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/data:/data
    # Pass through variables named in alerts.channels.*.url_env (e.g. APPRISE_SLACK_WEBHOOK).
    # Compose only interpolates ${VAR} keys that appear in `environment:` unless you also
    # load the project .env into the container via env_file.
    env_file:
      - path: .env
        required: false
    environment:
      - SNMP_COMMUNITY=${SNMP_COMMUNITY}
      - APPRISE_API_URL=${APPRISE_API_URL:-http://netspec-apprise:8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NETSPEC_ADMIN_PASSWORD_HASH=${NETSPEC_ADMIN_PASSWORD_HASH:-}
      - NETSPEC_SESSION_SECRET=${NETSPEC_SESSION_SECRET:-}
      - NETSPEC_API_TOKEN=${NETSPEC_API_TOKEN:-}
      - TLS_CERT_PATH=${TLS_CERT_PATH:-}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-}
    logging:
      driver: json-file
      options:
        max-size: ${NETSPEC_LOG_MAX_SIZE:-10m}
        max-file: "${NETSPEC_LOG_MAX_FILE:-5}"
    mem_limit: ${NETSPEC_MEM_LIMIT:-512m}
    cpus: "${NETSPEC_CPU_LIMIT:-1.0}"
    pids_limit: ${NETSPEC_PIDS_LIMIT:-256}
    depends_on:
      # Ordering only; does not wait for Apprise readiness.
      - netspec-apprise

  netspec-apprise:
    # Alternative registries if lscr.io is unavailable:
    # - docker.io/linuxserver/apprise-api:latest (Docker Hub)
    # - ghcr.io/linuxserver/apprise-api:latest (GitHub Container Registry)
    image: ${APPRISE_IMAGE:-docker.io/linuxserver/apprise-api:latest}
    container_name: netspec-apprise
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/apprise-config:/config
    ports:
      # Apprise-API uWSGI listens on 8000 inside the container (linuxserver image).
      # Published on 8086 for direct access; netspec reaches it via Docker DNS (netspec-apprise:8000).
      - "8086:8000"
    networks:
      - netspec
    logging:
      driver: json-file
      options:
        max-size: ${APPRISE_LOG_MAX_SIZE:-10m}
        max-file: "${APPRISE_LOG_MAX_FILE:-5}"
    mem_limit: ${APPRISE_MEM_LIMIT:-512m}
    cpus: "${APPRISE_CPU_LIMIT:-1.0}"
    pids_limit: ${APPRISE_PIDS_LIMIT:-256}

  netspec-mdt:
    image: ghcr.io/heymex/netspec-mdt:${NETSPEC_IMAGE_TAG:-latest}
    container_name: netspec-mdt
    restart: unless-stopped
    networks:
      - netspec
    ports:
      # Switch MDT dial-out target. Switches point to the host IP; Docker publishes to the container.
      - "57500:57500"
      - "${NETSPEC_MDT_METRICS_PORT:-8089}:8089"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NETSPEC_INGEST_HOST=${NETSPEC_INGEST_HOST:-netspec-netspec}
      - NETSPEC_INGEST_PORT=${NETSPEC_INGEST_PORT:-57500}
      - NETSPEC_INGEST_TARGETS=${NETSPEC_INGEST_TARGETS:-}
      - MDT_ALLOWED_DEVICES=${MDT_ALLOWED_DEVICES:-}
      - MDT_RESEND_INTERVAL=${MDT_RESEND_INTERVAL:-60s}
      - NETSPEC_MDT_METRICS_ADDR=${NETSPEC_MDT_METRICS_ADDR:-0.0.0.0:8089}
      - NETSPEC_MDT_WORKERS=${NETSPEC_MDT_WORKERS:-4}
      - NETSPEC_MDT_QUEUE_SIZE=${NETSPEC_MDT_QUEUE_SIZE:-1024}
    depends_on:
      - netspec-netspec
    logging:
      driver: json-file
      options:
        max-size: ${MDT_LOG_MAX_SIZE:-10m}
        max-file: "${MDT_LOG_MAX_FILE:-5}"
    mem_limit: ${MDT_MEM_LIMIT:-512m}
    cpus: "${MDT_CPU_LIMIT:-1.0}"
    pids_limit: ${MDT_PIDS_LIMIT:-256}

networks:
  netspec:
    driver: bridge
