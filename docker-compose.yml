# NetSpec + Apprise-API + Telegraf MDT + mdt-translator.
#
# NetSpec's job is to detect drift from desired state and surface it (including via alerts).
# Apprise-API receives NetSpec POST /notify traffic and fans out to Slack, email, Teams, etc.
# Service names use a netspec- prefix so the project groups cleanly in tooling and avoids
# clashing with other stacks on the same host (unique container names).
# For local builds from source, merge docker-compose.build-local.yml.

# Container names and host ports are parameterized so a Graph lab stack can run
# beside production (see .env.graph-lab.example and docs/NETSPECGRAPH.md).
# Docker DNS still uses *service* names (netspec-apprise, netspec-victoriametrics, …).

services:
  netspec-netspec:
    image: ghcr.io/heymex/netspec:${NETSPEC_IMAGE_TAG:-latest}
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-netspec
    restart: unless-stopped
    networks:
      - netspec
    ports:
      - "${API_PORT:-8088}:${API_PORT:-8088}"
    volumes:
      # Read-write so dashboard/API can persist split devices and desired-state edits under /config.
      # (Mounting :ro breaks deletes and patches to config/devices/*.yaml with "read-only file system".)
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/config:/config
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/data:/data
    # Pass through variables named in alerts.channels.*.url_env (e.g. APPRISE_SLACK_WEBHOOK).
    # Compose only interpolates ${VAR} keys that appear in `environment:` unless you also
    # load the project .env into the container via env_file.
    env_file:
      - path: ${NETSPEC_ENV_FILE:-.env}
        required: false
    environment:
      - SNMP_COMMUNITY=${SNMP_COMMUNITY}
      - APPRISE_API_URL=${APPRISE_API_URL:-http://netspec-apprise:8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NETSPEC_ADMIN_PASSWORD_HASH=${NETSPEC_ADMIN_PASSWORD_HASH:-}
      - NETSPEC_SESSION_SECRET=${NETSPEC_SESSION_SECRET:-}
      - NETSPEC_API_TOKEN=${NETSPEC_API_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: ${NETSPEC_LOG_MAX_SIZE:-10m}
        max-file: "${NETSPEC_LOG_MAX_FILE:-5}"
    mem_limit: ${NETSPEC_MEM_LIMIT:-512m}
    cpus: "${NETSPEC_CPU_LIMIT:-1.0}"
    pids_limit: ${NETSPEC_PIDS_LIMIT:-256}
    depends_on:
      # Ordering only; does not wait for Apprise readiness.
      - netspec-apprise

  netspec-apprise:
    # Alternative registries if lscr.io is unavailable:
    # - docker.io/linuxserver/apprise-api:latest (Docker Hub)
    # - ghcr.io/linuxserver/apprise-api:latest (GitHub Container Registry)
    image: ${APPRISE_IMAGE:-docker.io/linuxserver/apprise-api:latest}
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-apprise
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/apprise-config:/config
    ports:
      # Apprise-API uWSGI listens on 8000 inside the container (linuxserver image).
      # Published on APPRISE_HOST_PORT for direct access; netspec reaches it via Docker DNS (netspec-apprise:8000).
      - "${APPRISE_HOST_PORT:-8086}:8000"
    networks:
      - netspec
    logging:
      driver: json-file
      options:
        max-size: ${APPRISE_LOG_MAX_SIZE:-10m}
        max-file: "${APPRISE_LOG_MAX_FILE:-5}"
    mem_limit: ${APPRISE_MEM_LIMIT:-512m}
    cpus: "${APPRISE_CPU_LIMIT:-1.0}"
    pids_limit: ${APPRISE_PIDS_LIMIT:-256}

  # VictoriaMetrics: NetSpecGraph metrics store (Influx line protocol from Telegraf).
  # Does not change NetSpec state path (decoded.json → mdt-translator → ingest).
  netspec-victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:-victoriametrics/victoria-metrics:v1.114.0}
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-victoriametrics
    restart: unless-stopped
    networks:
      - netspec
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-400d}"
      - "-httpListenAddr=:8428"
      # Contracted Graph series use measurement name as __name__ (single field "value").
      - "-influxSkipSingleField"
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/victoria-metrics:/victoria-metrics-data
    ports:
      # Localhost-only for bring-up (vmui). Not published on the LAN.
      - "127.0.0.1:${VM_PORT:-8428}:8428"
    logging:
      driver: json-file
      options:
        max-size: ${VM_LOG_MAX_SIZE:-10m}
        max-file: "${VM_LOG_MAX_FILE:-5}"
    mem_limit: ${VM_MEM_LIMIT:-1g}
    cpus: "${VM_CPU_LIMIT:-1.0}"
    pids_limit: ${VM_PIDS_LIMIT:-256}

  # NetSpecGraph UI/API (opt-in). Metrics still land in VM without this profile.
  #   docker compose --profile graph up -d
  # Image ENTRYPOINT is ./netspec; override it so we do not run `netspec netspecgraph`.
  netspec-graph:
    profiles: ["graph"]
    image: ghcr.io/heymex/netspec:${NETSPEC_IMAGE_TAG:-latest}
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-graph
    restart: unless-stopped
    networks:
      - netspec
    entrypoint: ["./netspecgraph"]
    ports:
      - "${GRAPH_PORT:-8090}:${GRAPH_PORT:-8090}"
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/config:/config:ro
    env_file:
      - path: ${NETSPEC_ENV_FILE:-.env}
        required: false
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GRAPH_LISTEN_ADDR=:${GRAPH_PORT:-8090}
      - GRAPH_VM_URL=${GRAPH_VM_URL:-http://netspec-victoriametrics:8428}
      - GRAPH_CONFIG_DIR=/config
      - GRAPH_TIMEZONE=${GRAPH_TIMEZONE:-America/Chicago}
      - NETSPEC_ADMIN_PASSWORD_HASH=${NETSPEC_ADMIN_PASSWORD_HASH:-}
      - NETSPEC_SESSION_SECRET=${NETSPEC_SESSION_SECRET:-}
      - NETSPEC_API_TOKEN=${NETSPEC_API_TOKEN:-}
    depends_on:
      - netspec-victoriametrics
    logging:
      driver: json-file
      options:
        max-size: ${GRAPH_LOG_MAX_SIZE:-10m}
        max-file: "${GRAPH_LOG_MAX_FILE:-5}"
    mem_limit: ${GRAPH_MEM_LIMIT:-256m}
    cpus: "${GRAPH_CPU_LIMIT:-0.5}"
    pids_limit: ${GRAPH_PIDS_LIMIT:-128}

  netspec-telegraf-mdt:
    image: telegraf:1.31
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-telegraf-mdt
    restart: unless-stopped
    networks:
      - netspec
    ports:
      # Switch MDT dial-out target. Switches point to the host IP; Docker publishes to the container.
      - "${MDT_PORT:-57500}:57500"
    volumes:
      - ./tools/sidecar/telegraf-mdt.conf:/etc/telegraf/telegraf.conf:ro
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/mdt-sidecar:/sidecar
    depends_on:
      - netspec-victoriametrics
    logging:
      driver: json-file
      options:
        max-size: ${TELEGRAF_LOG_MAX_SIZE:-10m}
        max-file: "${TELEGRAF_LOG_MAX_FILE:-5}"
    mem_limit: ${TELEGRAF_MEM_LIMIT:-512m}
    cpus: "${TELEGRAF_CPU_LIMIT:-1.0}"
    pids_limit: ${TELEGRAF_PIDS_LIMIT:-256}

  netspec-mdt-translator:
    image: ghcr.io/heymex/netspec-mdt-translator:${NETSPEC_IMAGE_TAG:-latest}
    container_name: ${NETSPEC_NAME_PREFIX:-netspec}-mdt-translator
    restart: unless-stopped
    networks:
      - netspec
    depends_on:
      - netspec-telegraf-mdt
    environment:
      - MDT_DECODED_FILE=/sidecar/decoded.json
      - MDT_FORWARDER_LOG=/sidecar/forwarder.log
      # Optional multi-target fanout (comma-separated host:port), e.g.
      # NETSPEC_INGEST_TARGETS=10.10.199.38:57501,10.10.199.36:57501
      # If unset, translator falls back to NETSPEC_INGEST_HOST/PORT below.
      - NETSPEC_INGEST_TARGETS=${NETSPEC_INGEST_TARGETS:-}
      # Single-target fallback for backward compatibility.
      - NETSPEC_INGEST_HOST=${NETSPEC_INGEST_HOST:-netspec-netspec}
      - NETSPEC_INGEST_PORT=${NETSPEC_INGEST_PORT:-57500}
      - MDT_ALLOWED_DEVICES=${MDT_ALLOWED_DEVICES:-}
      - MDT_FORWARDER_LOG_MAX_BYTES=${MDT_FORWARDER_LOG_MAX_BYTES:-10485760}
      - MDT_FORWARDER_LOG_BACKUP_COUNT=${MDT_FORWARDER_LOG_BACKUP_COUNT:-3}
      - MDT_PRUNE_DECODED_ARCHIVES_ON_START=${MDT_PRUNE_DECODED_ARCHIVES_ON_START:-true}
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/mdt-sidecar:/sidecar
    logging:
      driver: json-file
      options:
        max-size: ${TRANSLATOR_LOG_MAX_SIZE:-10m}
        max-file: "${TRANSLATOR_LOG_MAX_FILE:-5}"
    mem_limit: ${TRANSLATOR_MEM_LIMIT:-512m}
    cpus: "${TRANSLATOR_CPU_LIMIT:-1.0}"
    pids_limit: ${TRANSLATOR_PIDS_LIMIT:-256}

networks:
  netspec:
    driver: bridge
