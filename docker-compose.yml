# NetSpec + Apprise. Does not start Telegraf or mdt-translator — those are defined in
# docker-compose.dev.yml (Compose merge; filename is historical). For the supported
# IOS-XE dial-out → MDT → NetSpec push pipeline, always add -f docker-compose.dev.yml.

services:
  netspec:
    image: ghcr.io/heymex/netspec:${NETSPEC_IMAGE_TAG:-latest}
    container_name: netspec
    restart: unless-stopped
    # Use host networking so NetSpec can reach devices on management VLANs.
    network_mode: host
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/config:/config:ro
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/data:/data
    environment:
      - SNMP_COMMUNITY=${SNMP_COMMUNITY}
      # With host networking, use 127.0.0.1 and the host-mapped Apprise port.
      - APPRISE_API_URL=${APPRISE_API_URL:-http://127.0.0.1:8086}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      # Startup ordering only; does not wait for Apprise health/readiness.
      - apprise

  apprise:
    # Alternative registries if lscr.io is unavailable:
    # - docker.io/linuxserver/apprise-api:latest (Docker Hub)
    # - ghcr.io/linuxserver/apprise-api:latest (GitHub Container Registry)
    image: ${APPRISE_IMAGE:-docker.io/linuxserver/apprise-api:latest}
    container_name: apprise
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/apprise-config:/config
    ports:
      # Apprise-API uWSGI listens on 8000 inside the container (linuxserver image).
      - "8086:8000"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
