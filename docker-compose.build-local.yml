# Merge with docker-compose.yml to build images from this repo instead of pulling from GHCR.
# Example:
#   export NETSPEC_DATA_DIR=/opt/netspec
#   docker compose -f docker-compose.yml -f docker-compose.build-local.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build-local.yml up -d
#
# Optional build metadata (e.g. from Makefile):
#   NETSPEC_LOCAL_VERSION  (default: dev)
#   NETSPEC_LOCAL_COMMIT   (default: unknown)
#   NETSPEC_LOCAL_BUILD_DATE (default: unknown)

services:
  netspec-netspec:
    image: netspec:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${NETSPEC_LOCAL_VERSION:-dev}
        COMMIT: ${NETSPEC_LOCAL_COMMIT:-unknown}
        BUILD_DATE: ${NETSPEC_LOCAL_BUILD_DATE:-unknown}

  netspec-mdt-translator:
    image: netspec-mdt-translator:local
    build:
      context: ./tools/sidecar
      dockerfile: Dockerfile
