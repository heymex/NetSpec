# Alert routing for NetSpec (loaded from config/alerts.yaml).
# Top-level `alerts:` inside desired-state.yaml is not used by the loader.

channels:
  ops-slack:
    type: apprise
    url_env: APPRISE_SLACK_WEBHOOK
    severity_filter: [warning, critical]

  ops-teams:
    type: apprise
    url_env: APPRISE_TEAMS_WEBHOOK
    severity_filter: [critical]

  # Generic HTTP webhooks (structured JSON). One channel can fan out to
  # several providers. See docs/WEBHOOK_ALERTING.md.
  # ops-webhooks:
  #   type: webhook
  #   severity_filter: [warning, critical]
  #   endpoints:
  #     - name: primary
  #       url_env: WEBHOOK_URL
  #       token_env: WEBHOOK_TOKEN
  #     - name: secondary
  #       url_env: WEBHOOK_SECONDARY_URL
  #       token_env: WEBHOOK_SECONDARY_TOKEN
  #       auth: bearer_and_header
  #       header_name: X-Webhook-Token

alert_rules:
  default:
    channels: [ops-slack]

  critical:
    channels: [ops-slack, ops-teams]

  warning:
    channels: [ops-slack]

alert_behavior:
  deduplication_window: 300s
