# Alert routing for NetSpec (loaded from config/alerts.yaml).
# Top-level `alerts:` inside desired-state.yaml is not used by the loader.

channels:
  ops-slack:
    type: apprise
    url_env: APPRISE_SLACK_WEBHOOK
    severity_filter: [warning, critical]

  ops-teams:
    type: apprise
    url_env: APPRISE_TEAMS_WEBHOOK
    severity_filter: [critical]

  # OpenClaw Gateway webhook (structured JSON). Point url_env at a mapped hook
  # (e.g. http://openclaw:18789/hooks/netspec) or /hooks/agent with a transform.
  # ops-openclaw:
  #   type: openclaw
  #   url_env: OPENCLAW_WEBHOOK_URL
  #   token_env: OPENCLAW_HOOK_TOKEN
  #   severity_filter: [warning, critical]

alert_rules:
  default:
    channels: [ops-slack]

  critical:
    channels: [ops-slack, ops-teams]

  warning:
    channels: [ops-slack]

alert_behavior:
  deduplication_window: 300s
