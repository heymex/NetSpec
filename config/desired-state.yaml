# NetSpec Desired State Configuration

global:
  default_credentials: vault://network/gnmi-creds
  telemetry_mode: snmp_validate_only # snmp_validate_only | telemetry_ingest_push
  collection_interval: 10s
  snmp:
    version: 2c
    port: 161
    community_env: SNMP_COMMUNITY
    validation_interval: 10s
    timeout: 3s
    retries: 1
  ingest:
    listen_address: 0.0.0.0
    port: 57500

devices: {}

alerts:
  channels:
    ops-slack:
      type: apprise
      url_env: APPRISE_SLACK_WEBHOOK
      severity_filter: [warning, critical]
      
    ops-teams:
      type: apprise
      url_env: APPRISE_TEAMS_WEBHOOK
      severity_filter: [critical]

  alert_rules:
    default:
      channels: [ops-slack]
      
    critical:
      channels: [ops-slack, ops-teams]
      
    warning:
      channels: [ops-slack]

  alert_behavior:
    deduplication_window: 300s
