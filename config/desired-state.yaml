# NetSpec Desired State Configuration

global:
  default_credentials: vault://network/gnmi-creds
  telemetry_mode: gnmi_pull # gnmi_pull | snmp_validate_only
  gnmi_port: 9338
  collection_interval: 10s
  snmp:
    version: 2c
    port: 161
    community_env: SNMP_COMMUNITY
    validation_interval: 10s
    timeout: 3s
    retries: 1

devices:
  core-sw-stack:
    address: 10.0.0.1
    description: "Core switch stack - Building A MDF"
    
    interfaces:
      Port-channel1:
        description: "Uplink to Distribution"
        desired_state: up
        admin_state: enabled
        alerts:
          state_mismatch: critical
          admin_down: warning
          
      GigabitEthernet1/0/1:
        description: "Server Room UPS"
        desired_state: up
        admin_state: enabled
        alerts:
          state_mismatch: warning

  dist-sw-01:
    address: 10.0.0.10
    description: "Distribution switch - Building A IDF-1"
    
    interfaces:
      Port-channel10:
        description: "Downlink to Access"
        desired_state: up
        admin_state: enabled
        alerts:
          state_mismatch: critical

alerts:
  channels:
    ops-slack:
      type: apprise
      url_env: APPRISE_SLACK_WEBHOOK
      severity_filter: [warning, critical]
      
    ops-teams:
      type: apprise
      url_env: APPRISE_TEAMS_WEBHOOK
      severity_filter: [critical]

  alert_rules:
    default:
      channels: [ops-slack]
      
    critical:
      channels: [ops-slack, ops-teams]
      
    warning:
      channels: [ops-slack]

  alert_behavior:
    deduplication_window: 300s
