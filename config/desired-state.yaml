# NetSpec Desired State Configuration
#
# Alert routing and channels belong in config/alerts.yaml (same directory). The loader
# merges alerts.yaml into runtime config; an `alerts:` key here is ignored.

global:
  default_credentials: vault://network/gnmi-creds
  # Production path: push ingest (IOS-XE dial-out → netspec-mdt → NetSpec).
  # snmp_validate_only = SNMP validation only, no push ingest listener.
  telemetry_mode: telemetry_ingest_push
  collection_interval: 10s
  snmp:
    version: 2c
    port: 161
    community_env: SNMP_COMMUNITY
    validation_interval: 10s
    # Optional fallback in telemetry_ingest_push mode: run periodic full SNMP polls.
    # WARNING: increases SNMP/device load and can slow larger deployments.
    telemetry_fallback_enabled: false
    telemetry_fallback_interval: 5m
    timeout: 3s
    retries: 1
  ingest:
    listen_address: 0.0.0.0
    port: 57500
    # Optional per-pipeline tags (stored on push events as PushTelemetryEvent.source).
    # source: netspec-mdt
    # additional_listeners:
    #   - port: 57501
    #     source: cribl_mdt

devices: {}

