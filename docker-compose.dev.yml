# MDT sidecar overlay: Telegraf (Cisco MDT in) + translator (NetSpec JSON line out).
# Use with docker-compose.yml — not standalone. Intended for any env with push
# telemetry (UAT, prod, lab), despite the "dev" filename.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  telegraf-mdt:
    image: telegraf:1.31
    container_name: telegraf-mdt
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./tools/sidecar/telegraf-mdt.conf:/etc/telegraf/telegraf.conf:ro
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/mdt-sidecar:/sidecar

  mdt-translator:
    build:
      context: ./tools/sidecar
      dockerfile: Dockerfile
    image: netspec-mdt-translator:local
    container_name: mdt-translator
    restart: unless-stopped
    network_mode: host
    depends_on:
      - telegraf-mdt
    environment:
      - MDT_DECODED_FILE=/sidecar/decoded.json
      - MDT_FORWARDER_LOG=/sidecar/forwarder.log
      - NETSPEC_INGEST_HOST=${NETSPEC_INGEST_HOST:-127.0.0.1}
      - NETSPEC_INGEST_PORT=${NETSPEC_INGEST_PORT:-57500}
      - MDT_ALLOWED_DEVICES=${MDT_ALLOWED_DEVICES:-}
    volumes:
      - ${NETSPEC_DATA_DIR:-/opt/netspec}/mdt-sidecar:/sidecar
