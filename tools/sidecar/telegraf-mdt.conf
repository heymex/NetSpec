[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true

[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57500"

# ---------------------------------------------------------------------------
# NetSpec state path (unchanged): rotating buffer → mdt-translator → ingest
# ---------------------------------------------------------------------------
[[outputs.file]]
  files = ["/sidecar/decoded.json"]
  data_format = "json"
  json_timestamp_units = "1s"
  # decoded.json is a short-lived buffer between Telegraf and mdt-translator (tail-only).
  # Without rotation it grows without bound (every MDT event is appended forever).
  rotation_max_size = "100MB"
  rotation_max_archives = 1

# ---------------------------------------------------------------------------
# NetSpecGraph metrics path: full-fidelity MDT → VictoriaMetrics (Influx LP)
# ---------------------------------------------------------------------------
# This is additive. It does not touch decoded.json, mdt-translator, or sub 251.
#
# Step 1 done-when: open http://127.0.0.1:8428/vmui and confirm interface
# counters for a known device with a non-zero rate() over ~5 minutes.
#
# Step 2 (schema freeze): Telegraf's cisco_telemetry_mdt names measurements
# and fields from the YANG path. Observe those names in vmui once, then pin
# the NetSpecGraph contract with [[processors.rename]] / tag mapping below.
# Target names (do not invent Telegraf source names — map after observing):
#   if_in_octets_total, if_out_octets_total,
#   if_in_errors_total, if_out_errors_total,
#   if_in_discards_total, if_out_discards_total,
#   if_in_unicast_pkts_total, if_out_unicast_pkts_total,
#   if_oper_status, if_speed_bps
# Labels (write time only): device, interface, lane (optics).
# Never write role/alias/neighbor_class/monitored/desired_state as labels.
#
# [[processors.rename]]
#   # Fill after observing live series in vmui — see docs/NETSPECGRAPH.md
#
[[outputs.influxdb]]
  urls = ["http://netspec-victoriametrics:8428"]
  database = "netspecgraph"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  content_encoding = "gzip"
