[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true

[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57500"

# ---------------------------------------------------------------------------
# Schema freeze (NetSpecGraph): clone + rename for VictoriaMetrics only.
# Original metrics are left untouched for outputs.file → mdt-translator.
# Observed live (lab, sub 30 / IETF interfaces-state):
#   measurement = ietf-interfaces:interfaces-state/interface
#   tags        = source, name, path, subscription
#   fields      = statistics/in_octets, …, speed, oper_status (string up/down/…)
# ---------------------------------------------------------------------------
[[processors.starlark]]
  namepass = ["ietf-interfaces:interfaces-state/interface"]
  source = '''
FIELD_MAP = {
    "statistics/in_octets": "if_in_octets_total",
    "statistics/out_octets": "if_out_octets_total",
    "statistics/in_errors": "if_in_errors_total",
    "statistics/out_errors": "if_out_errors_total",
    "statistics/in_discards": "if_in_discards_total",
    "statistics/out_discards": "if_out_discards_total",
    "statistics/in_unicast_pkts": "if_in_unicast_pkts_total",
    "statistics/out_unicast_pkts": "if_out_unicast_pkts_total",
    "speed": "if_speed_bps",
    "oper_status": "if_oper_status",
}

def apply(metric):
    out = [metric]
    device = metric.tags.get("source")
    iface = metric.tags.get("name")
    if device == None or iface == None or device == "" or iface == "":
        return out

    for src_field, dest_name in FIELD_MAP.items():
        if src_field not in metric.fields:
            continue
        val = metric.fields[src_field]
        if dest_name == "if_oper_status":
            # DevSpec: up → 1, everything else → 0 (string enums from MDT).
            if val == "up" or val == 1 or val == 1.0:
                val = 1
            else:
                val = 0
        else:
            # Influx/VM require numeric fields; skip unexpected strings.
            if type(val) == "string":
                continue

        m = deepcopy(metric)
        m.name = dest_name
        for k in list(m.tags.keys()):
            m.tags.pop(k)
        m.tags["device"] = device
        m.tags["interface"] = iface
        m.tags["_netspecgraph"] = "1"
        for k in list(m.fields.keys()):
            m.fields.pop(k)
        m.fields["value"] = val
        out.append(m)
    return out
'''

# ---------------------------------------------------------------------------
# Optics / DOM (lab sub 31 — Cisco-IOS-XE-transceiver-oper, not OpenConfig).
# Observed live (asw-st1-01 / asw-at205-01):
#   measurement = Cisco-IOS-XE-transceiver-oper:transceiver-oper-data/transceiver
#   tags        = source, name, path, subscription
#   fields      = input_power/instant, output_power/instant,
#                 laser_bias_current/instant, internal_temp, …
# Voltage is absent on this platform revision; lane omitted for single-lane SFP+.
# Copper SFPs (BaseT/BaseTX) report zeros — do not clone them into VM.
# ---------------------------------------------------------------------------
[[processors.starlark]]
  namepass = ["Cisco-IOS-XE-transceiver-oper:transceiver-oper-data/transceiver"]
  source = '''
FIELD_MAP = {
    "input_power/instant": "transceiver_rx_power_dbm",
    "output_power/instant": "transceiver_tx_power_dbm",
    "laser_bias_current/instant": "transceiver_laser_bias_ma",
    "internal_temp": "transceiver_temp_celsius",
}

def apply(metric):
    out = [metric]
    device = metric.tags.get("source")
    iface = metric.tags.get("name")
    if device == None or iface == None or device == "" or iface == "":
        return out

    pmd = metric.fields.get("ethernet_pmd")
    if type(pmd) == "string":
        pl = pmd.lower()
        if "basetx" in pl or "baset" in pl or "1000base-t" in pl:
            return out

    for src_field, dest_name in FIELD_MAP.items():
        if src_field not in metric.fields:
            continue
        val = metric.fields[src_field]
        if type(val) == "string" or type(val) == "bool":
            continue
        m = deepcopy(metric)
        m.name = dest_name
        for k in list(m.tags.keys()):
            m.tags.pop(k)
        m.tags["device"] = device
        m.tags["interface"] = iface
        m.tags["_netspecgraph"] = "1"
        for k in list(m.fields.keys()):
            m.fields.pop(k)
        m.fields["value"] = val
        out.append(m)
    return out
'''

# ---------------------------------------------------------------------------
# NetSpec state path (unchanged): rotating buffer → mdt-translator → ingest
# Drop Graph clones so the translator still sees native MDT field/tag names.
# ---------------------------------------------------------------------------
[[outputs.file]]
  files = ["/sidecar/decoded.json"]
  data_format = "json"
  json_timestamp_units = "1s"
  rotation_max_size = "100MB"
  rotation_max_archives = 1
  [outputs.file.tagdrop]
    _netspecgraph = ["1"]

# ---------------------------------------------------------------------------
# NetSpecGraph metrics path: contracted series → VictoriaMetrics (Influx LP)
# Only clones from the starlark processor. Strip the routing tag before write.
# VM must run with -influxSkipSingleField so measurement == metric name.
# ---------------------------------------------------------------------------
[[outputs.influxdb]]
  urls = ["http://netspec-victoriametrics:8428"]
  database = "netspecgraph"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  content_encoding = "gzip"
  tagexclude = ["_netspecgraph"]
  [outputs.influxdb.tagpass]
    _netspecgraph = ["1"]
